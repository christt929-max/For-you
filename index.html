<!DOCTYPE html>

<head>

    <meta charset="UTF-8">

    <title>For You ♡ Nazmaa Arindya Putriii</title>


    <style>
        /* =====================================================
   RESET
===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

        }


        body {

            overflow: hidden;

            background:
                radial-gradient(circle at center,
                    #5a4148 0%,
                    #24171d 55%,
                    #0e090c 100%);

            color: #fff;

            font-family:
                Georgia,
                "Times New Roman",
                serif;
        }


        /* =====================================================
   BACKGROUND HEARTS
===================================================== */

        .hearts {

            position: fixed;

            inset: 0;

            pointer-events: none;

            overflow: hidden;

        }


        .heart {

            position: absolute;

            bottom: -30px;

            opacity: 0;

            animation:
                floatHeart linear infinite;

        }


        @keyframes floatHeart {

            0% {

                transform:
                    translateY(0) rotate(0deg) scale(0.8);

                opacity: 0;

            }

            15% {

                opacity: 0.35;

            }

            80% {

                opacity: 0.2;

            }

            100% {

                transform:
                    translateY(-110vh) rotate(25deg) scale(1.2);

                opacity: 0;

            }

        }


        /* =====================================================
   MAIN
===================================================== */

        .voice-lock {

            position: relative;

            z-index: 2;

            width: 100%;

            height: 100%;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding: 25px;

        }


        .voice-content {

            width: min(90vw, 500px);

        }


        /* =====================================================
   SMALL TEXT
===================================================== */

        .intro {

            font-size: 13px;

            letter-spacing: 4px;

            text-transform: uppercase;

            opacity: 0.55;

            margin-bottom: 28px;

        }


        /* =====================================================
   TITLE
===================================================== */

        h1 {

            font-size:
                clamp(30px, 8vw, 52px);

            font-weight: normal;

            line-height: 1.2;

            margin-bottom: 22px;

        }


        .question {

            font-size:
                clamp(17px, 4vw, 21px);

            line-height: 1.8;

            opacity: 0.8;

        }


        /* =====================================================
   DATE HIGHLIGHT
===================================================== */

        .date-question {

            margin-top: 8px;

            font-size:
                clamp(20px, 5vw, 26px);

            font-style: italic;

        }


        /* =====================================================
   MIC
===================================================== */

        .mic-wrapper {

            margin-top: 45px;

            display: flex;

            justify-content: center;

        }


        .mic-button {

            position: relative;

            width: 82px;

            height: 82px;

            border: none;

            border-radius: 50%;

            background:
                rgba(255, 255, 255, 0.12);

            color: white;

            font-size: 30px;

            cursor: pointer;

            backdrop-filter: blur(10px);

            -webkit-backdrop-filter: blur(10px);

            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.15),

                0 10px 35px rgba(0, 0, 0, 0.3);

            transition:
                transform 0.3s ease,
                background 0.3s ease;

        }


        .mic-button:hover {

            transform:
                scale(1.08);

            background:
                rgba(255, 255, 255, 0.18);

        }


        /* =====================================================
   LISTENING
===================================================== */

        .mic-button.listening {

            animation:
                microphonePulse 1.3s infinite;

        }


        @keyframes microphonePulse {

            0% {

                box-shadow:
                    0 0 0 0 rgba(255, 150, 190, 0.5);

            }

            70% {

                box-shadow:
                    0 0 0 25px rgba(255, 150, 190, 0);

            }

            100% {

                box-shadow:
                    0 0 0 0 rgba(255, 150, 190, 0);

            }

        }


        /* =====================================================
   STATUS
===================================================== */

        .status {

            min-height: 28px;

            margin-top: 28px;

            font-size: 15px;

            opacity: 0.65;

            transition:
                opacity 0.3s ease;

        }


        /* =====================================================
   DETECTED TEXT
===================================================== */

        .detected {

            min-height: 24px;

            margin-top: 10px;

            font-size: 13px;

            font-style: italic;

            opacity: 0.4;

        }


        /* =====================================================
   SUCCESS
===================================================== */

        .success-screen {

            position: fixed;

            inset: 0;

            z-index: 10;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            background:
                radial-gradient(circle at center,
                    #6d4c56,
                    #1b1116);

            opacity: 0;

            visibility: hidden;

            pointer-events: none;

            transition:
                opacity 1s ease,
                visibility 1s ease;

        }


        .success-screen.show {

            opacity: 1;

            visibility: visible;

        }


        .success-content {

            transform:
                translateY(20px) scale(0.95);

            transition:
                transform 1s ease;

        }


        .success-screen.show .success-content {

            transform:
                translateY(0) scale(1);

        }


        .success-heart {

            font-size: 60px;

            margin-bottom: 25px;

            animation:
                heartBeat 1.2s infinite;

        }


        @keyframes heartBeat {

            0%,
            100% {

                transform:
                    scale(1);

            }

            50% {

                transform:
                    scale(1.15);

            }

        }


        .success-content h2 {

            font-size:
                clamp(28px, 7vw, 45px);

            font-weight: normal;

            margin-bottom: 15px;

        }


        .success-content p {

            font-size: 16px;

            opacity: 0.65;

        }


        /* =====================================================
   FADE OUT
===================================================== */

        .voice-lock.unlocking {

            animation:
                unlockFade 1.2s forwards;

        }


        @keyframes unlockFade {

            to {

                opacity: 0;

                transform:
                    scale(1.03);

            }

        }
    </style>

</head>


<body>

    <!-- =====================================================
     VOICE LOCK

    <main class="voice-lock" id="voiceLock">


        <div class="voice-content">


            <div class="intro">

            <h1>

    ```html
    <script>

        /* =====================================================
           ELEMENT
        ===================================================== */

        const micButton =
            document.getElementById("micButton");

        const status =
            document.getElementById("status");

        const detected =
            document.getElementById("detected");

        const voiceLock =
            document.getElementById("voiceLock");

        const successScreen =
            document.getElementById("successScreen");



        /* =====================================================
           SPEECH RECOGNITION
        ===================================================== */

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;


        if (!SpeechRecognition) {

            status.innerText =
                "Browser kamu belum mendukung voice recognition 😭";

            micButton.disabled = true;

        } else {

            const recognition =
                new SpeechRecognition();


            /* Bahasa Indonesia */

            recognition.lang = "id-ID";


            /*
               Terus mendengarkan sampai
               kata terdeteksi.
            */

            recognition.continuous = true;


            /*
               Tampilkan hasil sementara
               sambil user bicara.
            */

            recognition.interimResults = true;


            /*
               Ambil beberapa kemungkinan
               hasil pengenalan suara.
            */

            recognition.maxAlternatives = 5;


            let isListening = false;
            let listenTimeout;



            /* =================================================
               MIC CLICK
            ================================================= */

            micButton.addEventListener(
                "click",
                function () {

                    /*
                       Kalau sedang mendengarkan,
                       jangan start lagi.
                    */

                    if (isListening) {
                        return;
                    }


                    detected.innerText = "";


                    status.innerText =
                        "Aku mendengarkan... 🎙️";


                    micButton.classList.add(
                        "listening"
                    );


                    isListening = true;


                    try {

                        recognition.start();

                        /* Auto-stop setelah 15 detik */
                        listenTimeout = setTimeout(
                            function () {
                                recognition.stop();
                            },
                            15000
                        );

                    } catch (error) {

                        console.log(
                            "Recognition error:",
                            error
                        );

                        isListening = false;

                        micButton.classList.remove(
                            "listening"
                        );

                    }

                }
            );



            /* =================================================
               SAAT MULAI MENDENGARKAN
            ================================================= */

            recognition.addEventListener(
                "start",
                function () {

                    status.innerText =
                        "Silakan bicara... ❤️";

                }
            );



            /* =================================================
               HASIL SUARA
            ================================================= */

            recognition.addEventListener(
                "result",
                function (event) {


                    let transcript = "";
                    let interimTranscript = "";


                    /*
                       Ambil hasil final dan sementara.
                    */

                    for (
                        let i = 0;
                        i < event.results.length;
                        i++
                    ) {

                        const transcriptSegment =
                            event.results[i][0]
                                .transcript;

                        if (event.results[i].isFinal) {

                            transcript +=
                                transcriptSegment;

                        } else {

                            interimTranscript +=
                                transcriptSegment;

                        }

                    }


                    const finalTranscript =
                        transcript
                            .toLowerCase()
                            .trim();

                    const displayText = finalTranscript ||
                        interimTranscript.toLowerCase().trim();


                    console.log(
                        "Yang terdengar:",
                        finalTranscript
                    );


                    detected.innerText =
                        `"${displayText}"`;


                    /*
                       Beri feedback bahwa
                       suara sudah tertangkap.
                    */

                    status.innerText =
                        "Aku dengar: " +
                        displayText;



                    /* =========================================
                       CEK TANGGAL
                    ========================================= */

                    if (
                        checkDate(finalTranscript)
                    ) {

                        /* Kata terdeteksi → matikan mic */
                        recognition.stop();

                        unlockWebsite();

                    }

                }
            );



            /* =================================================
               SELESAI MENDENGARKAN
            ================================================= */

            recognition.addEventListener(
                "end",
                function () {

                    clearTimeout(listenTimeout);

                    isListening = false;

                    micButton.classList.remove(
                        "listening"
                    );

                }
            );



            /* =================================================
               ERROR
            ================================================= */

            recognition.addEventListener(
                "error",
                function (event) {

                    console.log(
                        "Speech error:",
                        event.error
                    );

                    clearTimeout(listenTimeout);

                    isListening = false;


                    micButton.classList.remove(
                        "listening"
                    );


                    if (
                        event.error ===
                        "not-allowed"
                    ) {

                        status.innerText =
                            "Microphone belum diizinkan 😭";

                    }

                    else if (
                        event.error ===
                        "no-speech"
                    ) {

                        status.innerText =
                            "Aku belum dengar suara kamu 😭 Coba ngomong lagi.";

                    }

                    else if (
                        event.error ===
                        "audio-capture"
                    ) {

                        status.innerText =
                            "Microphone tidak ditemukan.";

                    }

                    else {

                        status.innerText =
                            "Ada masalah dengan microphone. Coba lagi.";

                    }

                }
            );

        }



        /* =====================================================
           CEK TANGGAL — LEBIH PEKA
        ===================================================== */

        function checkDate(text) {

            text = text
                .toLowerCase()
                .replace(/[.,!?]/g, " ")
                .replace(/\s+/g, " ")
                .trim();


            /* Normalisasi angka */

            const normalized = text
                .replace(/\b2\b/g, "dua")
                .replace(/\b2024\b/g, "dua ribu dua puluh empat");


            /* Hari */

            const hasDay =
                normalized.includes("dua");


            /* Bulan */

            const hasMonth =
                normalized.includes("oktober") ||
                normalized.includes("october");


            /* Tahun */

            const hasYear =
                normalized.includes(
                    "dua ribu dua puluh empat"
                );


            return (
                hasDay &&
                hasMonth &&
                hasYear
            );
        }


        /* =====================================================
           UNLOCK WEBSITE
        ===================================================== */

        function unlockWebsite() {


            status.innerText =
                "Kamu masih ingat... ❤️";


            micButton.classList.remove(
                "listening"
            );


            voiceLock.classList.add(
                "unlocking"
            );


            setTimeout(
                function () {

                    successScreen.classList.add(
                        "show"
                    );

                },
                700
            );


            /*
               Tunggu animasi selesai,
               lalu masuk ke website.
            */

            setTimeout(
                function () {

                    window.location.href =
                        "home.html";

                },
                3000
            );

        }

    </script>
