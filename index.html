<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For You ♡ Nazmaa Arindya Putriiii</title>

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;

            background:
                radial-gradient(
                    circle at center,
                    #5a4148 0%,
                    #24171d 55%,
                    #0e090c 100%
                );

            color: #fff;

            font-family:
                Georgia,
                "Times New Roman",
                serif;
        }


        /* =====================================================
           BACKGROUND HEARTS
        ===================================================== */

        .hearts {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .heart {
            position: absolute;
            bottom: -30px;
            opacity: 0;

            animation:
                floatHeart linear infinite;
        }

        @keyframes floatHeart {

            0% {
                transform:
                    translateY(0)
                    rotate(0deg)
                    scale(0.8);

                opacity: 0;
            }

            15% {
                opacity: 0.35;
            }

            80% {
                opacity: 0.2;
            }

            100% {
                transform:
                    translateY(-110vh)
                    rotate(25deg)
                    scale(1.2);

                opacity: 0;
            }
        }


        /* =====================================================
           MAIN
        ===================================================== */

        .voice-lock {
            position: relative;
            z-index: 2;

            width: 100%;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 25px;
        }

        .voice-content {
            width: min(90vw, 500px);
        }


        /* =====================================================
           SMALL TEXT
        ===================================================== */

        .intro {
            font-size: 13px;
            letter-spacing: 4px;
            text-transform: uppercase;

            opacity: 0.55;

            margin-bottom: 28px;
        }


        /* =====================================================
           TITLE
        ===================================================== */

        h1 {
            font-size:
                clamp(30px, 8vw, 52px);

            font-weight: normal;

            line-height: 1.2;

            margin-bottom: 22px;
        }

        .question {
            font-size:
                clamp(17px, 4vw, 21px);

            line-height: 1.8;

            opacity: 0.8;
        }


        /* =====================================================
           DATE HIGHLIGHT
        ===================================================== */

        .date-question {
            margin-top: 8px;

            font-size:
                clamp(20px, 5vw, 26px);

            font-style: italic;
        }


        /* =====================================================
           MIC
        ===================================================== */

        .mic-wrapper {
            margin-top: 45px;

            display: flex;
            justify-content: center;
        }

        .mic-button {
            position: relative;

            width: 82px;
            height: 82px;

            border: none;
            border-radius: 50%;

            background:
                rgba(255, 255, 255, 0.12);

            color: white;

            font-size: 30px;

            cursor: pointer;

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.15),
                0 10px 35px rgba(0, 0, 0, 0.3);

            transition:
                transform 0.3s ease,
                background 0.3s ease;
        }

        .mic-button:hover {
            transform: scale(1.08);

            background:
                rgba(255, 255, 255, 0.18);
        }

        .mic-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }


        /* =====================================================
           LISTENING
        ===================================================== */

        .mic-button.listening {
            animation:
                microphonePulse 1.3s infinite;
        }

        @keyframes microphonePulse {

            0% {
                box-shadow:
                    0 0 0 0
                    rgba(255, 150, 190, 0.5);
            }

            70% {
                box-shadow:
                    0 0 0 25px
                    rgba(255, 150, 190, 0);
            }

            100% {
                box-shadow:
                    0 0 0 0
                    rgba(255, 150, 190, 0);
            }
        }


        /* =====================================================
           STATUS
        ===================================================== */

        .status {
            min-height: 28px;

            margin-top: 28px;

            font-size: 15px;

            opacity: 0.65;

            transition:
                opacity 0.3s ease;
        }


        /* =====================================================
           DETECTED TEXT
        ===================================================== */

        .detected {
            min-height: 24px;

            margin-top: 10px;

            font-size: 13px;

            font-style: italic;

            opacity: 0.4;
        }


        /* =====================================================
           SUCCESS
        ===================================================== */

        .success-screen {
            position: fixed;
            inset: 0;

            z-index: 10;

            display: flex;

            align-items: center;
            justify-content: center;

            text-align: center;

            background:
                radial-gradient(
                    circle at center,
                    #6d4c56,
                    #1b1116
                );

            opacity: 0;
            visibility: hidden;

            pointer-events: none;

            transition:
                opacity 1s ease,
                visibility 1s ease;
        }

        .success-screen.show {
            opacity: 1;
            visibility: visible;
        }

        .success-content {
            transform:
                translateY(20px)
                scale(0.95);

            transition:
                transform 1s ease;
        }

        .success-screen.show .success-content {
            transform:
                translateY(0)
                scale(1);
        }

        .success-heart {
            font-size: 60px;

            margin-bottom: 25px;

            animation:
                heartBeat 1.2s infinite;
        }

        @keyframes heartBeat {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }

        .success-content h2 {
            font-size:
                clamp(28px, 7vw, 45px);

            font-weight: normal;

            margin-bottom: 15px;
        }

        .success-content p {
            font-size: 16px;

            opacity: 0.65;
        }


        /* =====================================================
           FADE OUT
        ===================================================== */

        .voice-lock.unlocking {
            animation:
                unlockFade 1.2s forwards;
        }

        @keyframes unlockFade {

            to {
                opacity: 0;

                transform:
                    scale(1.03);
            }
        }

    </style>

</head>


<body>


    <!-- =====================================================
         FLOATING HEARTS
    ===================================================== -->

    <div class="hearts">

        <span class="heart"
              style="left:10%; animation-duration:12s; font-size:18px;">
            ♡
        </span>

        <span class="heart"
              style="left:25%; animation-duration:16s; font-size:14px;">
            ♡
        </span>

        <span class="heart"
              style="left:42%; animation-duration:13s; font-size:20px;">
            ♡
        </span>

        <span class="heart"
              style="left:60%; animation-duration:18s; font-size:15px;">
            ♡
        </span>

        <span class="heart"
              style="left:78%; animation-duration:14s; font-size:19px;">
            ♡
        </span>

        <span class="heart"
              style="left:90%; animation-duration:17s; font-size:13px;">
            ♡
        </span>

    </div>


    <!-- =====================================================
         VOICE LOCK
    ===================================================== -->

    <main class="voice-lock" id="voiceLock">

        <div class="voice-content">

            <div class="intro">
                A little question
            </div>

            <h1>
                Sebelum kamu masuk...
            </h1>

            <p class="question">
                Aku mau tahu satu hal kecil.
            </p>

            <p class="date-question">
                Tanggal berapa semuanya dimulai?
            </p>


            <!-- MICROPHONE -->

            <div class="mic-wrapper">

                <button
                    class="mic-button"
                    id="micButton"
                    aria-label="Mulai berbicara">

                    🎙️

                </button>

            </div>


            <p class="status" id="status">
                Tekan mic dan ucapkan tanggalnya...
            </p>

            <p class="detected" id="detected"></p>

        </div>

    </main>


    <!-- =====================================================
         SUCCESS
    ===================================================== -->

    <div class="success-screen" id="successScreen">

        <div class="success-content">

            <div class="success-heart">
                ❤️
            </div>

            <h2>
                Kamu masih ingat...
            </h2>

            <p>
                2 Oktober 2024.
            </p>

        </div>

    </div>


    <script>

        /* =====================================================
           ELEMENT
        ===================================================== */

        const micButton =
            document.getElementById("micButton");

        const status =
            document.getElementById("status");

        const detected =
            document.getElementById("detected");

        const voiceLock =
            document.getElementById("voiceLock");

        const successScreen =
            document.getElementById("successScreen");


        /* =====================================================
           SPEECH RECOGNITION
        ===================================================== */

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;


        /*
           Browser tidak mendukung microphone
        */

        if (!SpeechRecognition) {

            status.innerText =
                "Browser ini belum mendukung voice recognition 😭";

            micButton.disabled = true;

        } else {

            const recognition =
                new SpeechRecognition();


            /*
               Bahasa Indonesia
            */

            recognition.lang = "id-ID";


            /*
               PENTING:
               Jangan continuous.

               Kita hanya ingin menangkap
               satu jawaban.
            */

            recognition.continuous = false;


            /*
               Tampilkan hasil sementara
            */

            recognition.interimResults = true;


            /*
               Ambil beberapa alternatif
            */

            recognition.maxAlternatives = 5;


            let isListening = false;
            let hasUnlocked = false;
            let listenTimeout = null;


            /* =================================================
               NORMALISASI TEXT
            ================================================= */

            function normalizeText(text) {

                return text
                    .toLowerCase()
                    .normalize("NFD")
                    .replace(/[\u0300-\u036f]/g, "")
                    .replace(/[.,!?]/g, " ")
                    .replace(/\s+/g, " ")
                    .trim();

            }


            /* =================================================
               CEK TANGGAL
            ================================================= */

            function checkDate(text) {

                const normalized =
                    normalizeText(text);


                console.log(
                    "Hasil voice:",
                    normalized
                );


                /*
                   Bentuk angka:

                   2 oktober 2024
                   02 oktober 2024
                */

                const numericDate =
                    /(?:^|\s)0?2(?:\s+|[-/])(?:oktober|october)(?:\s+|[-/])2024(?:\s|$)/i;


                if (numericDate.test(normalized)) {
                    return true;
                }


                /*
                   Bentuk:

                   dua oktober 2024
                */

                if (
                    normalized.includes("dua") &&
                    (
                        normalized.includes("oktober") ||
                        normalized.includes("october")
                    ) &&
                    normalized.includes("2024")
                ) {

                    return true;

                }


                /*
                   Bentuk:

                   dua oktober
                   dua ribu dua puluh empat
                */

                const hasDay =
                    normalized.includes("dua") ||
                    normalized.includes("2") ||
                    normalized.includes("02");


                const hasMonth =
                    normalized.includes("oktober") ||
                    normalized.includes("october") ||
                    normalized.includes("okt");


                const hasYearWords =
                    normalized.includes("2024") ||
                    normalized.includes("dua ribu dua puluh empat") ||
                    normalized.includes("dua ribu duapuluh empat") ||
                    normalized.includes("dua puluh empat") ||
                    normalized.includes("24");


                if (
                    hasDay &&
                    hasMonth &&
                    hasYearWords
                ) {

                    return true;

                }


                /*
                   Beberapa hasil speech recognition
                   kadang menjadi:

                   2 oktober 24

                   atau

                   dua oktober dua ribu 24
                */

                if (
                    hasDay &&
                    hasMonth &&
                    (
                        normalized.includes("24") ||
                        normalized.includes("dua ribu")
                    )
                ) {

                    return true;

                }


                return false;

            }


            /* =================================================
               START MICROPHONE
            ================================================= */

            micButton.addEventListener(
                "click",
                function () {


                    /*
                       Kalau sedang listening,
                       jangan jalankan lagi.
                    */

                    if (isListening || hasUnlocked) {
                        return;
                    }


                    detected.innerText = "";


                    status.innerText =
                        "Menyalakan microphone... 🎙️";


                    micButton.classList.add(
                        "listening"
                    );


                    isListening = true;


                    /*
                       Timeout 10 detik.
                       Kalau tidak bicara,
                       otomatis berhenti.
                    */

                    clearTimeout(listenTimeout);


                    listenTimeout =
                        setTimeout(
                            function () {

                                if (isListening) {

                                    recognition.stop();

                                    status.innerText =
                                        "Belum terdengar apa-apa. Coba lagi ❤️";

                                }

                            },
                            10000
                        );


                    try {

                        recognition.start();

                    } catch (error) {

                        console.log(
                            "Recognition start error:",
                            error
                        );

                        isListening = false;

                        micButton.classList.remove(
                            "listening"
                        );

                        status.innerText =
                            "Coba tekan microphone lagi.";

                    }

                }
            );


            /* =================================================
               RECOGNITION START
            ================================================= */

            recognition.addEventListener(
                "start",
                function () {

                    status.innerText =
                        "Silakan ucapkan tanggalnya... ❤️";

                }
            );


            /* =================================================
               HASIL SUARA
            ================================================= */

            recognition.addEventListener(
                "result",
                function (event) {


                    let finalText = "";
                    let interimText = "";


                    for (
                        let i = event.resultIndex;
                        i < event.results.length;
                        i++
                    ) {

                        const result =
                            event.results[i];


                        const transcript =
                            result[0].transcript;


                        if (result.isFinal) {

                            finalText += transcript;

                        } else {

                            interimText += transcript;

                        }

                    }


                    const finalNormalized =
                        normalizeText(finalText);


                    const interimNormalized =
                        normalizeText(interimText);


                    const displayText =
                        finalNormalized ||
                        interimNormalized;


                    if (displayText) {

                        detected.innerText =
                            `"${displayText}"`;

                        status.innerText =
                            "Aku dengar: " +
                            displayText;

                    }


                    /*
                       Hanya cek hasil FINAL
                    */

                    if (
                        finalNormalized &&
                        checkDate(finalNormalized)
                    ) {

                        hasUnlocked = true;

                        clearTimeout(
                            listenTimeout
                        );


                        status.innerText =
                            "Kamu masih ingat... ❤️";


                        recognition.stop();


                        unlockWebsite();

                    }

                }
            );


            /* =================================================
               RECOGNITION END
            ================================================= */

            recognition.addEventListener(
                "end",
                function () {

                    clearTimeout(
                        listenTimeout
                    );


                    isListening = false;


                    micButton.classList.remove(
                        "listening"
                    );


                    /*
                       Kalau belum berhasil,
                       user bisa klik lagi.
                    */

                    if (!hasUnlocked) {

                        /*
                           Jangan langsung ubah pesan
                           kalau sudah ada hasil suara.
                        */

                        if (
                            !detected.innerText
                        ) {

                            status.innerText =
                                "Tekan mic dan coba lagi... ❤️";

                        }

                    }

                }
            );


            /* =================================================
               ERROR
            ================================================= */

            recognition.addEventListener(
                "error",
                function (event) {

                    console.log(
                        "Speech recognition error:",
                        event.error
                    );


                    clearTimeout(
                        listenTimeout
                    );


                    isListening = false;


                    micButton.classList.remove(
                        "listening"
                    );


                    switch (event.error) {


                        case "not-allowed":

                            status.innerText =
                                "Microphone belum diizinkan 😭";

                            break;


                        case "permission-denied":

                            status.innerText =
                                "Izin microphone ditolak 😭";

                            break;


                        case "no-speech":

                            status.innerText =
                                "Aku belum dengar suara kamu 😭 Coba tekan mic lagi.";

                            break;


                        case "audio-capture":

                            status.innerText =
                                "Microphone tidak ditemukan 😭";

                            break;


                        case "network":

                            status.innerText =
                                "Voice recognition membutuhkan koneksi internet.";

                            break;


                        case "aborted":

                            status.innerText =
                                "Microphone berhenti. Tekan lagi untuk mencoba.";

                            break;


                        default:

                            status.innerText =
                                "Ada masalah dengan microphone. Coba lagi.";

                            break;

                    }

                }
            );

        }


        /* =====================================================
           UNLOCK WEBSITE
        ===================================================== */

        function unlockWebsite() {


            /*
               Cegah fungsi terpanggil dua kali
            */

            if (
                successScreen.classList.contains("show")
            ) {
                return;
            }


            status.innerText =
                "Kamu masih ingat... ❤️";


            micButton.classList.remove(
                "listening"
            );


            /*
               Fade halaman utama
            */

            voiceLock.classList.add(
                "unlocking"
            );


            /*
               Tampilkan success screen
            */

            setTimeout(
                function () {

                    successScreen.classList.add(
                        "show"
                    );

                },
                700
            );


            /*
               Setelah 3 detik,
               masuk home.html
            */

            setTimeout(
                function () {

                    window.location.href =
                        "home.html";

                },
                3000
            );

        }

    </script>

</body>

</html>
